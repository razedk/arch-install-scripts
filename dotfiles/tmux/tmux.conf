# Use Ctrl-a as the prefix instead of Ctrl-b
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 100000

# Faster escape time (helps with Vim/Neovim)
set -sg escape-time 0

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Reload config without restarting tmux
bind r source-file ~/.config/tmux.conf \; display-message "Config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use vi keys in copy mode
setw -g mode-keys vi

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Quieter status bar
set -g status-interval 5

# Make window notifications easier to notice
setw -g monitor-activity on
set -g visual-activity on
